name: build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "版本递增类型"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. 计算版本并创建草稿 Release ─────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.new_version }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 必须拉取完整 tag 历史

      - name: 计算下一个版本号（满 10 进 1）
        id: version
        shell: bash
        run: |
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            NEW_VERSION="1.0.0"
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "首次发布，版本: $NEW_VERSION"
            exit 0
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST_TAG#v}"
          # 强制十进制，避免 08/09 被当作八进制；缺位补 0
          MAJOR=$((10#${MAJOR:-0}))
          MINOR=$((10#${MINOR:-0}))
          PATCH=$((10#${PATCH:-0}))

          BUMP="${{ github.event.inputs.bump || 'patch' }}"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            *)     PATCH=$((PATCH + 1)) ;;
          esac

          # 满 10 进 1：patch → minor → major
          if [ "$PATCH" -ge 10 ]; then
            PATCH=$((PATCH - 10))
            MINOR=$((MINOR + 1))
          fi
          if [ "$MINOR" -ge 10 ]; then
            MINOR=$((MINOR - 10))
            MAJOR=$((MAJOR + 1))
          fi

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "上一个 tag: $LATEST_TAG → 下一个版本: $NEW_VERSION"

      - name: 创建草稿 Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.new_version }}"
          REPO="${{ github.repository }}"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，直接复用"
          else
            NOTES=$'去中心化 Minecraft 启动器\n\n## 特性\n- 从 Mojang 官方获取并安装游戏版本，可调并发多线程下载\n- 可选安装 Fabric / Forge / NeoForge 加载器\n- Modrinth 模组搜索 / 安装 / required 依赖自动补全\n- 版本隔离：每个实例独立目录\n- 离线账号为主，可选微软正版登录（设备码流程）\n- Windows / macOS / Linux 全平台'
            gh release create "$TAG" --repo "$REPO" --draft --title "SoloMC $TAG" --notes "$NOTES"
          fi

          RELEASE_ID=$(gh release view "$TAG" --repo "$REPO" --json databaseId -q .databaseId)
          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT

  # ── 2. 三平台构建，通过 releaseId 并行上传 ───────────────────
  build:
    name: build (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macos-universal
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            name: linux-x64
            args: ""
          - platform: windows-latest
            name: windows-x64
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.name, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: npm ci

      - name: Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf

      - name: 生成并转换图标
        run: |
          python -m pip install --upgrade pillow
          python scripts/gen_icon.py
          npx tauri icon src-tauri/icons/icon.png

      # 注意：如果 tauri.conf.json 的 build.beforeBuildCommand 也是 npm run build，
      # 这里会重复构建一次。可删除本步、交给 tauri-action 执行。
      - name: 前端构建
        run: npm run build

      - name: Tauri 构建并上传资产
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 显式指定 releaseId：三个平台都上传到同一个草稿 Release
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # 注入计算出的版本号，保证二进制内版本与 tag 一致
          appVersion: ${{ needs.create-release.outputs.version }}
          args: ${{ matrix.args }}

  # ── 3. 全部平台成功后，自动把草稿转为正式发布 ────────────────
  publish:
    name: publish release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: 将草稿转为正式 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${{ needs.create-release.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --draft=false